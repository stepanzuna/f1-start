[project]
name = "f1-start"
version = "0.1.0"
description = "F1 start pod zátěží pracovní paměti (experiment, PsychoPy)"
readme = "README.md"
authors = [
    { name = "stepanzuna" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "psychopy>=2026.2.5",
    "scipy>=1.16",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
extend-select = ["E402"]
